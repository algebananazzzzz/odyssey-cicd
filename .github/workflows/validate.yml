name: Validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    name: 🧩 Validate Manifest + Fragments
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔧 Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: 🔍 Validate
        run: |
          go vet ./...
          go run ./cmd validate
