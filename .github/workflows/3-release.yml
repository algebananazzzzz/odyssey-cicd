name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

run-name: Release ${{ github.ref_name }}

concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  tag:
    name: 🏷️ Cut Release Tag
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.bump.outputs.tag }}

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: 🔢 Compute Next Tag
        id: bump
        env:
          TITLE: ${{ github.event.head_commit.message }}
          BODY: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          tag="$(.github/scripts/semver-tag.sh)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: 🏷️ Push Tag
        env:
          NEW_TAG: ${{ steps.bump.outputs.tag }}
        run: |
          set -euo pipefail
          git tag "$NEW_TAG" "$GITHUB_SHA"
          git push origin "$NEW_TAG"

  release:
    name: 📦 Publish Release
    runs-on: ubuntu-latest
    needs: [tag]
    if: |
      always() &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && needs.tag.result == 'success'))

    permissions:
      contents: write

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.tag.outputs.tag || github.ref_name }}
          fetch-depth: 0
          fetch-tags: true

      - name: 🔧 Setup
        uses: ./.github/actions/setup

      - name: 🚀 GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
