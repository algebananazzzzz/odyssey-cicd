inputs: [PROJECT]

providers:
  cloudflare:
    inputs: [CLOUDFLARE_ACCOUNT_ID, ZONE_NAME, STATE_BUCKET]
  aws:
    inputs: [STATE_BUCKET]

architectures:
  cloudflare-worker:
    provider: cloudflare
    inputs: [R2_LOCATION, CUSTOM_DOMAIN, WORKER_NAME]
  cloudflare-pages:
    provider: cloudflare
  aws-ecs:
    provider: aws

stacks:
  nextjs:
    architectures: [cloudflare-worker]
  astro:
    architectures: [cloudflare-pages]
  node-puppeteer:
    architectures: [aws-ecs]
  go-service:
    architectures: [aws-ecs]
