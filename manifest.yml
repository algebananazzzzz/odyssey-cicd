inputs:
  PREPROD_URL: {optional: true}
  PRD_URL: {optional: true}

providers:
  cloudflare:
    github:
      variables: [STATE_BUCKET, CLOUDFLARE_ACCOUNT_ID, ZONE_NAME]
      secrets: [CLOUDFLARE_API_TOKEN, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY]
  aws:
    github:
      variables: [STATE_BUCKET, AWS_REGION]
      secrets: [AWS_ROLE_ARN]

architectures:
  cloudflare-worker:
    provider: cloudflare
    inputs:
      CUSTOM_DOMAIN: {optional: true}
  cloudflare-pages:
    provider: cloudflare
  aws-ecs:
    provider: aws

stacks:
  nextjs:
    architectures: [cloudflare-worker]
  astro:
    architectures: [cloudflare-pages]
  node-puppeteer:
    architectures: [aws-ecs]
  go-service:
    architectures: [aws-ecs]
