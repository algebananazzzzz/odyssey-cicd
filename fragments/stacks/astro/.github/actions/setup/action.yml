name: Setup Toolchain
description: Install Node.js and project dependencies.

inputs:
  node-version:
    description: Node.js version. Ignored when .nvmrc is present.
    required: false
    default: "22"

runs:
  using: composite
  steps:
    - name: ⚙️ Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        node-version-file: ${{ hashFiles('.nvmrc') != '' && '.nvmrc' || '' }}
        cache: npm

    - name: 📦 Install Dependencies
      shell: bash
      run: make setup
