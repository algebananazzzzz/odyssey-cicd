# The ONLY stack-aware file in .github/. Every workflow calls it as step 2, then
# speaks nothing but `make`. Swapping stacks means swapping this file.

name: Setup Toolchain
description: Install Python (via uv) and project dependencies.

inputs:
  python-version:
    description: Python version. Ignored when .python-version is present.
    required: false
    default: "3.13"

runs:
  using: composite
  steps:
    - name: ⚙️ Setup uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    - name: 🐍 Setup Python
      shell: bash
      run: uv python install ${{ inputs.python-version }}

    - name: 📦 Install Dependencies
      shell: bash
      run: make setup
