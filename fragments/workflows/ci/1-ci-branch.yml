name: CI (branch)

on:
  push:
    branches-ignore:
      - main

concurrency:
  group: ci-branch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 🔍 Static + Unit
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔧 Setup
        uses: ./.github/actions/setup

      - name: 🔍 Check
        run: make check

      - name: 🧪 Test
        run: make test
