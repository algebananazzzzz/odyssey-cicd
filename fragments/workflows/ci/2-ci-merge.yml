name: CI (merge)

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ci-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: 📦 Static + Unit + Build
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔧 Setup
        uses: ./.github/actions/setup

      - name: 🔍 Check
        run: make check

      - name: 🧪 Test
        run: make test

      - name: 📦 Build
        run: make build


