name: Deploy (preprod)

on:
  pull_request:
    types: [closed]
    branches:
      - main
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+-beta"

concurrency:
  group: deploy-preprod
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  tag:
    name: 🏷️ Cut Pre-release Tag
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.bump.outputs.tag }}

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: 🔢 Compute Next Tag
        id: bump
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
          SUFFIX: "-beta"
        run: |
          set -euo pipefail
          tag="$(.github/scripts/semver-tag.sh)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: 🏷️ Push Tag
        env:
          NEW_TAG: ${{ steps.bump.outputs.tag }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail
          git tag "$NEW_TAG" "$MERGE_SHA"
          git push origin "$NEW_TAG"

  deploy:
    name: 🚀 Deploy to preprod
    runs-on: ubuntu-latest
    needs: [tag]
    if: |
      always() &&
      (github.event_name == 'push' ||
       (github.event_name == 'pull_request' && needs.tag.result == 'success'))

    permissions:
      contents: read
      id-token: write

    environment:
      name: "{{PREPROD_ENV}}"

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.tag.outputs.tag || github.ref }}

      - name: 🔧 Setup
        uses: ./.github/actions/setup

# >>> infra
# <<< infra

# >>> deploy
      - name: 🚀 Deploy
        run: make deploy ENV=preprod
# <<< deploy

  promote:
    name: ⬆️ Promote to prd
    runs-on: ubuntu-latest
    needs: [tag, deploy]
    if: ${{ !cancelled() && needs.deploy.result == 'success' }}
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: 🏷️ Cut Production Tag
        env:
          TAG: ${{ needs.tag.outputs.tag || github.ref_name }}
        run: .github/scripts/promote-tag.sh
