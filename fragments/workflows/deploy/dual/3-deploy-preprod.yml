# .github/workflows/3-deploy-preprod.yml
name: 3. Deploy (preprod)

# Trigger — exactly two cases:
#   1. A PR is merged into main.
#      -> Cut the next vX.Y.Z-beta tag and deploy it. The bump level comes from
#         the squashed PR title, Conventional Commits style:
#           feat!: / fix!: / BREAKING CHANGE in body  -> major   1.4.7 -> 2.0.0
#           feat: / feat(scope):                      -> minor   1.4.7 -> 1.5.0
#           anything else                             -> patch   1.4.7 -> 1.4.8
#   2. A vX.Y.Z-beta tag is pushed by hand.
#      -> Deploy that tag. Use this to redeploy, or to cut a minor/major bump
#         that the automatic patch bump will never produce.
#
# On a green deploy the `promote` job cuts the same version without the suffix
# (v1.2.0-beta -> v1.2.0) and dispatches 4-deploy-prd.yml against it.
#
# WHY DISPATCH AND NOT JUST PUSH THE TAG:
# A ref pushed with the default GITHUB_TOKEN does not start a workflow run.
# workflow_dispatch and repository_dispatch are the two documented exceptions.
# So the promote job pushes the tag (for provenance) AND dispatches explicitly.
# Relying on the tag push alone silently ships nothing.
#
# The whole path runs on the merge commit, and the deploy checks out the TAG,
# never a branch — what ships always matches a named commit.

on:
  pull_request:
    types: [closed]
    branches:
      - main
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+-beta"

concurrency:
  group: deploy-preprod
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  # ---------------------------------------------------------------------------
  # Case 1 only. Skipped on the tag-push path.
  # ---------------------------------------------------------------------------
  tag:
    name: 🏷️ Cut Pre-release Tag
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.bump.outputs.tag }}

    steps:
      - name: 1. 📄 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: 2. 🔢 Compute Next Pre-release Tag
        id: bump
        env:
          # Read through env, never interpolated into the script body. A PR
          # title is attacker-controlled on a fork PR; `${{ }}` inside a run
          # block would splice it in as shell source before bash ever sees it.
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          git fetch --tags --force

          # Glob only -beta tags. `--sort=-v:refname` mis-orders mixed
          # pre-release and final tags unless versionsort.suffix is configured;
          # restricting to one suffix makes the comparison purely numeric.
          latest="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*-beta' --sort=-v:refname | head -n1)"

          # Conventional Commits, read off the squashed PR title. Order matters:
          # a breaking marker wins over feat. Anything unrecognised is a patch,
          # so a sloppy title can never produce a surprise major.
          if   [[ "$PR_TITLE" == *'!:'* || "$PR_BODY" == *'BREAKING CHANGE'* ]]; then
            bump=major
          elif [[ "$PR_TITLE" =~ ^feat(\(.+\))?: ]]; then
            bump=minor
          else
            bump=patch
          fi

          if [ -z "$latest" ]; then
            next="v0.1.0-beta"
          else
            core="${latest#v}"; core="${core%-beta}"
            # The glob's `*` matches dots too, so v1.2.3.4-beta would reach here
            # and break the arithmetic below with an opaque error. Reject it.
            if [[ ! "$core" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Latest pre-release tag '$latest' is not vX.Y.Z-beta."
              exit 1
            fi
            IFS='.' read -r MAJOR MINOR PATCH <<< "$core"

            case "$bump" in
              major) next="v$((MAJOR + 1)).0.0-beta" ;;
              minor) next="v${MAJOR}.$((MINOR + 1)).0-beta" ;;
              patch) next="v${MAJOR}.${MINOR}.$((PATCH + 1))-beta" ;;
            esac
          fi

          if git rev-parse -q --verify "refs/tags/$next" >/dev/null; then
            echo "::error::$next already exists. A previous release likely failed"
            echo "::error::after tagging — delete it or push the next tag by hand."
            exit 1
          fi

          echo "title:    $PR_TITLE"
          echo "bump:     $bump"
          echo "previous: ${latest:-<none>}"
          echo "next:     $next"
          echo "tag=$next" >> "$GITHUB_OUTPUT"

      - name: 3. 🏷️ Push Tag
        env:
          NEW_TAG: ${{ steps.bump.outputs.tag }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$NEW_TAG" "$MERGE_SHA"
          git push origin "$NEW_TAG"

  # ---------------------------------------------------------------------------
  # Runs on the tag-push path, or after `tag` succeeds on the merge path.
  # ---------------------------------------------------------------------------
  deploy:
    name: ⚙️ Deploy to preprod
    runs-on: ubuntu-latest
    needs: [tag]
    if: |
      always() &&
      (github.event_name == 'push' ||
       (github.event_name == 'pull_request' && needs.tag.result == 'success'))

    environment:
      name: preprod
      url: "{{PREPROD_URL}}"

    steps:
      - name: 1. 📄 Checkout Repository
        uses: actions/checkout@v4
        with:
          # merge path: the tag just cut. tag path: needs.tag.outputs.tag is
          # empty, so fall back to the pushed ref.
          ref: ${{ needs.tag.outputs.tag || github.ref }}

      - name: 2. ⚙️ Setup Toolchain
        uses: ./.github/actions/setup

# >>> infra
      - name: 3. ☁️ Provision Infrastructure
        run: make infra ENV=preprod
# <<< infra

      - name: 4. 🚀 Deploy
        run: make deploy ENV=preprod

  # ---------------------------------------------------------------------------
  # Green preprod -> cut vX.Y.Z and ship it.
  # ---------------------------------------------------------------------------
  promote:
    name: 🏷️ Promote to Production
    runs-on: ubuntu-latest
    needs: [tag, deploy]
    # `tag` is skipped on the tag-push path, which would cascade-skip this job.
    # Gate on the deploy result directly.
    if: ${{ !cancelled() && needs.deploy.result == 'success' }}
    permissions:
      contents: write
      actions: write

    steps:
      - name: 1. 📄 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: 2. 🏷️ Cut Production Tag
        id: cut
        env:
          BETA_TAG: ${{ needs.tag.outputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          git fetch --tags --force

          case "$BETA_TAG" in
            v*.*.*-beta) ;;
            *) echo "::error::'$BETA_TAG' is not a vX.Y.Z-beta tag — refusing to promote."; exit 1 ;;
          esac

          PRD_TAG="${BETA_TAG%-beta}"
          echo "tag=$PRD_TAG" >> "$GITHUB_OUTPUT"

          if git rev-parse -q --verify "refs/tags/$PRD_TAG" >/dev/null; then
            echo "::notice::$PRD_TAG already exists — reusing it."
            exit 0
          fi

          # Tag the commit preprod actually deployed, not whatever main is now.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$PRD_TAG" "${BETA_TAG}^{commit}"
          git push origin "$PRD_TAG"

      - name: 3. 🚢 Dispatch Production Deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRD_TAG: ${{ steps.cut.outputs.tag }}
        run: |
          set -euo pipefail
          # The tag push above cannot start a run (GITHUB_TOKEN). Dispatch does.
          gh workflow run 4-deploy-prd.yml --ref "$PRD_TAG" -f tag="$PRD_TAG"
          echo "::notice::Dispatched production deploy for $PRD_TAG."
