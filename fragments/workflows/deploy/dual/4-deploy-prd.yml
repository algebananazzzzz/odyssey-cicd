name: Deploy (prd)

# Dispatched by 3-deploy-preprod after a green preprod deploy. Also accepts a
# tag push, and a manual dispatch for redeploy or rollback.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Production tag to deploy (e.g. v1.2.0)"
        required: true
        type: string
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

run-name: Deploy ${{ inputs.tag || github.ref_name }} to prd

concurrency:
  group: deploy-prd
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  deploy:
    name: 🚀 Deploy to prd
    runs-on: ubuntu-latest

    environment:
      name: prd
      url: "{{PRD_URL}}"

    env:
      TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: ✅ Validate Tag
        run: |
          set -euo pipefail
          case "$TAG" in
            v*.*.*-*) echo "::error::'$TAG' is a pre-release tag. prd ships clean vX.Y.Z only."; exit 1 ;;
            v*.*.*)   ;;
            *)        echo "::error::'$TAG' is not a vX.Y.Z tag."; exit 1 ;;
          esac

      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}

      - name: 🔧 Setup
        uses: ./.github/actions/setup

# >>> infra
      - name: ☁️ Infra
        run: make infra ENV=prd
# <<< infra

      - name: 🚀 Deploy
        run: make deploy ENV=prd
