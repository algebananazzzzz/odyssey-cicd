name: Deploy (prd)

on:
  workflow_dispatch:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

run-name: Deploy ${{ github.ref_name }} to prd

concurrency:
  group: deploy-prd
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  deploy:
    name: 🚀 Deploy to prd
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    environment:
      name: "{{PRD_ENV}}"

    env:
      TAG: ${{ github.ref_name }}

    steps:
      - name: ✅ Validate Tag
        run: |
          set -euo pipefail
          case "$TAG" in
            v*.*.*-*) echo "::error::'$TAG' is a pre-release tag. prd ships clean vX.Y.Z only."; exit 1 ;;
            v*.*.*)   ;;
            *)        echo "::error::'$TAG' is not a vX.Y.Z tag."; exit 1 ;;
          esac

      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔧 Setup
        uses: ./.github/actions/setup

# >>> infra
# <<< infra

# >>> deploy
      - name: 🚀 Deploy
        run: make deploy ENV=prd
# <<< deploy
