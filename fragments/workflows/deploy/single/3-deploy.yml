name: Deploy (prd)

# Push to main cuts vX.Y.Z and deploys it. Dispatch an existing tag to redeploy
# or roll back.
#
# Bump level comes from the squash-merge commit subject:
#   feat!: / fix!: / BREAKING CHANGE in body   major
#   feat: / feat(scope):                       minor
#   anything else                              patch

on:
  push:
    branches:
      - main
  workflow_dispatch:

run-name: Deploy ${{ needs.tag.outputs.tag || github.ref_name }} to prd

concurrency:
  group: deploy-prd
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  tag:
    name: 🏷️ Cut Release Tag
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.bump.outputs.tag }}

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: 🔢 Compute Next Tag
        id: bump
        env:
          # Via env, never ${{ }} inside the run block. These strings are
          # attacker-controlled on a fork's pull request, and interpolation
          # splices them into the step as shell source.
          TITLE: ${{ github.event.head_commit.message }}
          BODY: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          tag="$(.github/scripts/semver-tag.sh)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: 🏷️ Push Tag
        env:
          NEW_TAG: ${{ steps.bump.outputs.tag }}
        run: |
          set -euo pipefail
          git tag "$NEW_TAG" "$GITHUB_SHA"
          git push origin "$NEW_TAG"

  deploy:
    name: 🚀 Deploy to prd
    runs-on: ubuntu-latest
    needs: [tag]
    # `tag` is skipped on the dispatch path, so gate on event instead of needs.
    if: |
      always() &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && needs.tag.result == 'success'))

    permissions:
      contents: read
      id-token: write

    environment:
      name: "{{PRD_ENV}}"
      url: "{{PRD_URL}}"

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.tag.outputs.tag || github.ref_name }}

      - name: 🔧 Setup
        uses: ./.github/actions/setup

# >>> infra
# <<< infra

# >>> deploy
      - name: 🚀 Deploy
        run: make deploy ENV=prd
# <<< deploy
