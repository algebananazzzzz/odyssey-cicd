# .github/workflows/3-deploy.yml
name: 3. Deploy (prd)

# Trigger — two paths:
#   1. Push to main. Cuts the next vX.Y.Z tag and deploys it. The bump level
#      comes from the squash-merge commit subject, Conventional Commits style:
#        feat!: / fix!: / BREAKING CHANGE in body  -> major   1.4.7 -> 2.0.0
#        feat: / feat(scope):                      -> minor   1.4.7 -> 1.5.0
#        anything else                             -> patch   1.4.7 -> 1.4.8
#   2. workflow_dispatch with an existing tag — redeploy or roll back.
#
# Single-environment shape: same 1-ci-branch / 2-ci-merge gates as the dual
# shape, but no promotion ladder — the tag is cut and shipped in one run. The
# deploy still checks out the tag rather than the branch, so what ships always
# matches a named commit and a rollback target exists.

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to deploy (e.g. v1.2.0)"
        required: true
        type: string

run-name: Deploy ${{ inputs.tag || 'main' }} to prd

concurrency:
  group: deploy-prd
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  tag:
    name: 🏷️ Cut Release Tag
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.bump.outputs.tag }}

    steps:
      - name: 1. 📄 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: 2. 🔢 Compute Next Tag
        id: bump
        env:
          # Push event, so there is no pull_request payload — the squash-merge
          # commit message carries the PR title as its first line. Read through
          # env, never interpolated into the script body: the message is
          # attacker-controlled on a fork PR and `${{ }}` inside a run block
          # would splice it in as shell source.
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          git fetch --tags --force
          latest="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)"

          subject="${COMMIT_MSG%%$'\n'*}"

          # Conventional Commits. Order matters: a breaking marker wins over
          # feat. Anything unrecognised is a patch, so a sloppy title can never
          # produce a surprise major.
          if   [[ "$subject" == *'!:'* || "$COMMIT_MSG" == *'BREAKING CHANGE'* ]]; then
            bump=major
          elif [[ "$subject" =~ ^feat(\(.+\))?: ]]; then
            bump=minor
          else
            bump=patch
          fi

          if [ -z "$latest" ]; then
            next="v0.1.0"
          else
            core="${latest#v}"
            # The glob's `*` matches dots too, so v1.2.3.4 would reach here and
            # break the arithmetic below with an opaque error. Reject it.
            if [[ ! "$core" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Latest tag '$latest' is not vX.Y.Z."
              exit 1
            fi
            IFS='.' read -r MAJOR MINOR PATCH <<< "$core"

            case "$bump" in
              major) next="v$((MAJOR + 1)).0.0" ;;
              minor) next="v${MAJOR}.$((MINOR + 1)).0" ;;
              patch) next="v${MAJOR}.${MINOR}.$((PATCH + 1))" ;;
            esac
          fi

          if git rev-parse -q --verify "refs/tags/$next" >/dev/null; then
            echo "::error::$next already exists — refusing to retag."
            exit 1
          fi

          echo "subject:  $subject"
          echo "bump:     $bump"
          echo "previous: ${latest:-<none>}"
          echo "next:     $next"
          echo "tag=$next" >> "$GITHUB_OUTPUT"

      - name: 3. 🏷️ Push Tag
        env:
          NEW_TAG: ${{ steps.bump.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$NEW_TAG" "$GITHUB_SHA"
          git push origin "$NEW_TAG"

  deploy:
    name: ⚙️ Deploy to prd
    runs-on: ubuntu-latest
    needs: [tag]
    if: |
      always() &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && needs.tag.result == 'success'))

    environment:
      name: prd
      url: "{{PRD_URL}}"

    steps:
      - name: 1. 📄 Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.tag.outputs.tag || inputs.tag }}

      - name: 2. ⚙️ Setup Toolchain
        uses: ./.github/actions/setup

# >>> infra
      - name: 3. ☁️ Provision Infrastructure
        run: make infra ENV=prd
# <<< infra

      - name: 4. 🚀 Deploy
        run: make deploy ENV=prd
